name: Deploy site

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [external-content-updated]

permissions:
  contents: write

concurrency:
  group: site-deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Test content imports and change detection
        run: bundle exec ruby -e 'Dir["test/*_test.rb"].sort.each { |file| require_relative file }'
      - name: Capture external content for this build
        run: bundle exec ruby bin/external_content.rb prepare --output-dir "$RUNNER_TEMP/external-content"
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install and Build 🔧
        run: |
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build --lsi --config "_config.yml,$RUNNER_TEMP/external-content/config.yml"
          cp "$RUNNER_TEMP/external-content/state.json" _site/external-content-state.json
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
